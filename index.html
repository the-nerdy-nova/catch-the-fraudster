<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch the Fraudster</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">N</span>
      <span>NovaPay</span>
      <span class="brand-sub">Fraud Operations</span>
    </div>
    <div class="topbar-title">Catch the Fraudster</div>
  </header>

  <main id="app">
    <!-- Shown when something goes wrong (e.g. the page was opened by double-click) -->
    <div id="notice" class="notice" hidden></div>

    <!-- The transaction the player is deciding on -->
    <section id="case-card" class="card" hidden>
      <div class="card-head">
        <span class="label">Transaction under review</span>
        <span id="case-id" class="case-id"></span>
      </div>
      <div class="card-amount">
        <span id="case-amount" class="amount"></span>
        <span id="case-method" class="method"></span>
      </div>
      <dl id="case-fields" class="fields"></dl>

      <!-- Extra clues, shown after pressing Investigate -->
      <div id="clue-panel" class="clue-panel" hidden>
        <p id="clue-hint" class="clue-hint"></p>
        <div id="clue-list" class="clue-list"></div>
      </div>

      <div class="actions">
        <button id="btn-approve" class="btn btn-approve" type="button">Approve</button>
        <button id="btn-investigate" class="btn btn-investigate" type="button"
                aria-expanded="false" aria-controls="clue-panel">Investigate</button>
        <button id="btn-decline" class="btn btn-decline" type="button">Decline</button>
      </div>
    </section>

    <!-- The "Case closed" explanation shown after a decision -->
    <section id="reveal" class="card reveal" hidden>
      <div class="card-head">
        <span class="label">Case closed</span>
        <span id="reveal-truth" class="badge"></span>
      </div>
      <h2 id="reveal-verdict" class="verdict"></h2>
      <p id="reveal-outcome" class="outcome"></p>
      <h3 id="reveal-pattern" class="pattern-name"></h3>
      <p id="reveal-explanation"></p>
      <h4 class="signs-title">Clues that gave it away</h4>
      <ul id="reveal-giveaways" class="giveaways"></ul>
      <h4 class="signs-title">Warning signs to remember</h4>
      <ul id="reveal-signs" class="signs"></ul>
      <div class="actions">
        <button id="btn-next" class="btn btn-primary" type="button">Next case</button>
      </div>
    </section>
  </main>

  <footer class="footer">All people, companies and transactions are fictional.</footer>

  <script>
    // Browsers block loading the game's files when the page is opened by
    // double-click (a file:// address), so explain what to do instead.
    if (location.protocol === 'file:') {
      var notice = document.getElementById('notice');
      notice.hidden = false;
      notice.innerHTML =
        '<strong>Almost there.</strong> This game needs a tiny local server to load its data.' +
        '<br>In Terminal, go to the project folder and run <code>python3 -m http.server 8000</code>,' +
        ' then open <code>http://localhost:8000</code>.';
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
